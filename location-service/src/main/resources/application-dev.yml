springdoc:
  show-actuator: true

locationService:
  config:
    check-property: hello-world
    database:
      name: location-service
      collection-name: office-location-document
      spatial-index-field-name: officeCoordinates
    pickup-radius: 10000 # in meters or 10 km
  data:
    mongodb:
      uri: mongodb://host.docker.internal:27017/
logging:
  level:
    org.springframework.data.mongodb.core.ReactiveMongoTemplate: DEBUG
    org.springframework.data.mongodb.repository.query: DEBUG
    org.mongodb.driver.protocol.command: DEBUG